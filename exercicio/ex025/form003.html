<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Teste de Formulário</h1>
    <form action="cadastro.php" method="get" autocomplete="on">
    <p>
        <label for="inome">Nome</label>
        <input type="text" name="nome" id="inome" required maxlength="30" placeholder="Ada Lovelace" autocomplete="name">
    </p>
    <p>
        <label for="imedia">Média</label>
        <input type="number" name="media" id="imedia" min="0" max="10" placeholder="0 a 10"  step="0.5" required>
    </p>
    <p>
        <label for="imes">Período Letivo</label>
        <input type="month" name="Mes" id="imes">
    </p>
    <p>
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
    </p>
    <h1>Segundo Teste</h1>
    <form action="cadastro.php" autocomplete="on">
        <p>Nome</p>
        <p>Medía</p>

    </form>
    </form>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Exercício de  Tabela</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            width: 500px;
            border-collapse: collapse;
        }

        caption {
            font-size: 1.3em;
            font-weight: bolder;
            padding: 8px;
        }
        
        th,td {
            border: 1px solid black;
            padding: 8px;
        }
        .destaque {
            background-color:  chartreuse;;
        }
        col.cnome {
            background-color: rgba(128, 255, 0, 0.486);
        }
        col.csexo {
            background-color: cadetblue;
        }
        col.cidade {
            background-color:  cadetblue;
        }
        col.cprofissão {
            background-color: rgba(128, 255, 0, 0.486);
        }
    </style>
</head>
<body>

    <table>
